    <section id="project" class="bg-cream-50 text-color-ink py-15">
        <div class="max-w-6xl mx-auto px-6">
            <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight mb-2.5 text-brown-dark">Konverensi Bilangan Desimal ke Biner, Oktal, dan Heksadesimal</h2>
            <p class="text-sm text-brown mb-4">Masukkan angka Desimal yang ingin anda ubah kedalam bentuk lain.</p>

            <div class="flex flex-col bg-white/[0.06] border border-brown/25 rounded-3xl p-4 md:p-9 mt-9">
                <label class="text-base md:text-base font-bold mb-4">Angka Desimal</label>
                <input class="border p-3 border-brown/25 rounded-lg mb-3" type="number" id="desimal" name="desimal" required placeholder="Masukkan Angka">

                <label class="text-base md:text-base font-bold mb-4">Angka Biner</label>
                <input class="border p-3 border-brown/25 rounded-lg mb-3" type="text" id="biner" name="biner" disabled placeholder="">

                <label class="text-base md:text-base font-bold mb-4">Angka Oktal</label>
                <input class="border p-3 border-brown/25 rounded-lg mb-3" type="text" id="oktal" name="oktal" disabled placeholder="">

                <label class="text-base md:text-base font-bold mb-4">Angka Hexadesimal</label>
                <input class="border p-3 border-brown/25 rounded-lg mb-3" type="text" id="hexadesimal" name="hexadesimal" disabled placeholder="">
            </div>
        </div>
    </section>

    <script>
        const desimal = document.getElementById('desimal');
        const biner = document.getElementById('biner');
        const oktal = document.getElementById('oktal');
        const hexadesimal = document.getElementById('hexadesimal');

        desimal.addEventListener('input', function(){
            const nilaiDesimal = parseInt(desimal.value);

            if(isNaN(nilaiDesimal)){
                biner.value = "-";
                oktal.value = "-";
                hexadesimal.value = "-";
                return
            }

            biner.value = nilaiDesimal.toString(2);
            oktal.value = nilaiDesimal.toString(8);
            hexadesimal.value = nilaiDesimal.toString(16).toUpperCase();
        });
    </script>
